name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # --no-wait: the build and submission run on EAS, no need to hold a runner for them
      - run: eas build -p ios --profile production --auto-submit --non-interactive --no-wait
